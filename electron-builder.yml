appId: app.north.desktop
productName: North
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  - '!docs/**'
  - '!.cursor/**'
  - '!.github/**'
  - '!.husky/**'
  - '!vitest.config.ts'
  - '!biome.json'
  - '!components.json'
  - '!release/**'
  - '!.cypress-cache/**'
  - '!cypress/**'
  - '!cypress.config.ts'
  - '!e2e-harness/**'
  - '!**/*.{spec,test}.{ts,tsx,js,jsx}'
  - '!**/migrations.test.ts'
  - '!**/repositories.test.ts'
asarUnpack:
  - 'resources/**'
  - '**/*.{node,dylib,so,dll}'
win:
  executableName: North
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: North-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: North Code Signing
  forceCodeSigning: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: North needs access to Documents for import/export.
    - NSDownloadsFolderUsageDescription: North needs access to Downloads for import/export.
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: North-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  maintainer: north.app
  category: Utility
appImage:
  artifactName: North-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: YanGraim
  repo: north
