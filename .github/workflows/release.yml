name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_PUBLISH: never
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
            dist_command: dist:mac
            artifact_name: north-mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - target: win
            os: windows-latest
            dist_command: dist:win
            artifact_name: north-win
            artifact_glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - target: linux
            os: ubuntu-latest
            dist_command: dist:linux
            artifact_name: north-linux
            artifact_glob: |
              release/*.AppImage
              release/*.blockmap
              release/latest-linux.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build installer
        env:
          # Só o job mac recebe o .p12. No Windows o electron-builder tentaria
          # assinar o .exe com este certificado e falharia.
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
        run: npm run ${{ matrix.dist_command }}

      - name: List release output
        shell: bash
        run: |
          if [ -d release ]; then
            ls -la release
          else
            echo "release/ directory missing"
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/**/*
