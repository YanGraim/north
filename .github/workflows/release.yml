name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_PUBLISH: never
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-latest
            dist_command: dist:mac
            artifact_name: north-mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - target: win
            os: windows-latest
            dist_command: dist:win
            artifact_name: north-win
            artifact_glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - target: linux
            os: ubuntu-latest
            dist_command: dist:linux
            artifact_name: north-linux
            artifact_glob: |
              release/*.AppImage
              release/*.blockmap
              release/latest-linux.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Prepare macOS signing certificate
        if: matrix.target == 'mac'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_B64}" ]; then
            echo "GitHub secret CSC_LINK is missing (base64 of the North Code Signing .p12)."
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD}" ]; then
            echo "GitHub secret CSC_KEY_PASSWORD is missing."
            exit 1
          fi

          CERT_P12="$RUNNER_TEMP/north-codesign.p12"
          CERT_CER="$RUNNER_TEMP/north-codesign.cer"
          echo "$CSC_LINK_B64" | base64 --decode > "$CERT_P12"

          # Self-signed certs import as CSSMERR_TP_NOT_TRUSTED until marked as a
          # trusted code-signing root — same Keychain step done locally.
          extract_cer() {
            openssl pkcs12 -in "$CERT_P12" -nokeys -clcerts -passin pass:"$CSC_KEY_PASSWORD" "$@" \
              | openssl x509 -out "$CERT_CER"
          }
          extract_cer || extract_cer -legacy

          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT_CER"

          echo "CSC_LINK=$CERT_P12" >> "$GITHUB_ENV"

          echo "Code signing identities after trust:"
          security find-identity -v -p codesigning

      - name: Build installer
        env:
          # Só o job mac recebe senha e auto-discovery. CSC_LINK vem do passo anterior.
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'mac' && 'true' || 'false' }}
        run: npm run ${{ matrix.dist_command }}

      - name: List release output
        shell: bash
        run: |
          if [ -d release ]; then
            ls -la release
          else
            echo "release/ directory missing"
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/**/*
